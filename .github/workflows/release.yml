name: Build Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build Client (Windows)
      run: |
        set CGO_ENABLED=1
        set GOOS=windows
        set GOARCH=amd64
        go build -v -o ping-windows.exe .

    - name: Upload Client
      uses: actions/upload-artifact@v4
      with:
        name: ping-client-windows
        path: ping-windows.exe

  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Linux Graphics Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Build Client (Linux)
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -o ping-linux .

    - name: Upload Client
      uses: actions/upload-artifact@v4
      with:
        name: ping-client-linux
        path: ping-linux

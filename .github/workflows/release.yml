name: Build and Release Client

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build Client (Windows)
      run: |
        $env:CGO_ENABLED="1"
        $env:GOOS="windows"
        $env:GOARCH="amd64"
        go build -v -o ping-windows.exe .

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ping-client-windows
        path: ping-windows.exe

  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Linux Graphics Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Build Client (Linux)
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -o ping-linux .

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ping-client-linux
        path: ping-linux

  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows Build
      uses: actions/download-artifact@v4
      with:
        name: ping-client-windows
        path: ./dist

    - name: Download Linux Build
      uses: actions/download-artifact@v4
      with:
        name: ping-client-linux
        path: ./dist

    - name: Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Development Build"
        body: "Automated build generated from the latest push to the main branch."
        files: |
          ./dist/ping-windows.exe
          ./dist/ping-linux
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

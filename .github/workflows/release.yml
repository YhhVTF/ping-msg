# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: Build for ${{ matrix.os }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: windows
            ext: .exe
            goos: windows
            goarch: amd64
          - os: linux
            ext: ''
            goos: linux
            goarch: amd64
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version:  '1.24'

    - name: Build Client
      run: |
        CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o ping-${{ matrix.os }}${{ matrix.ext }} .

    - name: Upload Client
      uses: actions/upload-artifact@v4
      with:
        name: ping-client-${{ matrix.os }}
        path: ping-${{ matrix.os }}${{ matrix.ext }}
